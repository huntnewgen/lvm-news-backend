version: "3.9"

services:
  backend:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - db
      - redis
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lvm_news
      POSTGRES_USER: lvm_user
      POSTGRES_PASSWORD: senha_segura
    volumes:
      - lvm_pgdata:/var/lib/postgresql/data
      - ./lvm_news_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  lvm_pgdata:
